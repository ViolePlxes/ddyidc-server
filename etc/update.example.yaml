# Linux/amd64 production defaults. Merge this section into etc/config.yaml.
# Runtime credentials belong in the mode-0600 config file, never in Git.
Update:
  GitPath: "/usr/bin/git"
  GoPath: "/usr/local/go/bin/go"
  NPMPath: "/usr/local/bin/npm"
  SystemctlPath: "/usr/bin/systemctl"
  SudoPath: "/usr/bin/sudo"
  ServerService: "ddyidc.service"
  UpdateHelperService: "ddyidc-update-helper.service"
  MinFreeMB: 10240
  TimeoutSeconds: 600
  HealthURL: "http://127.0.0.1:8080/health"
  VersionURL: "http://127.0.0.1:8080/api/v1/system/version"
  SmokeURL: "http://127.0.0.1:8080/api/v1/products"
  ResultDir: "/opt/ddyidc/update-results"
  Backend:
    Workspace: "/opt/ddyidc/server"
    Branch: "main"
    Executable: "/opt/ddyidc/bin/ddyidc-server"
    ConfigFile: "/opt/ddyidc/server/etc/config.yaml"
    HelperPath: "/opt/ddyidc/bin/ddyidc-update-helper"
  Frontend:
    Workspace: "/opt/ddyidc/web-react"
    Branch: "main"
    StaticURL: "http://127.0.0.1:8081/"
