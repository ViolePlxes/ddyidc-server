map $http_upgrade $ddyidc_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ddyidc_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# Local-only static health endpoint used by the updater after a frontend build.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    root /opt/ddyidc/web-react/dist;
    location / { try_files /index.html =503; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name REPLACE_WITH_DOMAIN;

    root /opt/ddyidc/web-react/dist;
    index index.html;
    access_log /var/log/nginx/ddyidc-access.log;
    error_log /var/log/nginx/ddyidc-error.log warn;
    client_max_body_size 10m;
    ssl_certificate /etc/ddyidc/tls/fullchain.pem;
    ssl_certificate_key /etc/ddyidc/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DDYIDC_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss:; worker-src 'self' blob:" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /health {
        proxy_pass http://ddyidc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/instance/[0-9]+/vnc/ws$ {
        proxy_pass http://ddyidc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ddyidc_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://ddyidc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location ^~ /admin/v1/ {
        proxy_pass http://ddyidc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /console.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /admin.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /sales.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /version.json { add_header Cache-Control "no-cache, no-store, must-revalidate"; }

    location ~ ^/admin(?:/|$) { try_files $uri $uri/ /admin.html; }
    location ~ ^/sales(?:/|$) { try_files $uri $uri/ /sales.html; }
    location ~ ^/(?:console(?:/|$)|cart/?$|order/confirm/?$|bind-mobile/?$) {
        try_files $uri $uri/ /console.html;
    }
    location / { try_files $uri $uri/ /index.html; }
}
