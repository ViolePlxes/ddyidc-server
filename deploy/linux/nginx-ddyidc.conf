map $http_upgrade $ddyidc_connection_upgrade {
    default upgrade;
    ''      close;
}

# Deliberately exclude query strings, cookies, authorization and referrers.
# VNC URLs carry short-lived credentials in the query string.
log_format ddyidc_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent rt=$request_time request_id=$request_id';

upstream ddyidc_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# Local-only static health endpoint used by the updater after a frontend build.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    root /var/lib/ddyidc/update/workspaces/frontend/dist;
    location / { try_files /index.html =503; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name REPLACE_WITH_DOMAIN;

    root /var/lib/ddyidc/update/workspaces/frontend/dist;
    index index.html;
    access_log /var/log/nginx/ddyidc-access.log ddyidc_safe;
    error_log /var/log/nginx/ddyidc-error.log warn;
    client_max_body_size 10m;
    ssl_certificate /etc/ddyidc/tls/fullchain.pem;
    ssl_certificate_key /etc/ddyidc/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DDYIDC_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline' https://static.geetest.com https://static.geevisit.com; script-src 'self' https://static.geetest.com https://gcaptcha4.geetest.com https://static.geevisit.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; connect-src 'self' wss: https://gcaptcha4.geetest.com https://static.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com https://static.geevisit.com; frame-src 'self' https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; worker-src 'self' blob:" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /health {
        proxy_pass http://ddyidc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/instance/[0-9]+/vnc/ws$ {
        proxy_pass http://ddyidc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ddyidc_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://ddyidc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # OAuth callbacks are backend endpoints; completion stays in the portal SPA.
    location ~ ^/auth/(github|qq)/callback$ {
        proxy_pass http://ddyidc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
    }

    location ^~ /admin/v1/ {
        # Nested regex takes precedence inside this API prefix while the outer
        # ^~ keeps normal API requests out of the admin SPA regex below.
        location ~ ^/admin/v1/customers/[0-9]+/instances/[0-9]+/vnc/ws$ {
            proxy_pass http://ddyidc_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $ddyidc_connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }
        proxy_pass http://ddyidc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline' https://static.geetest.com https://static.geevisit.com; script-src 'self' https://static.geetest.com https://gcaptcha4.geetest.com https://static.geevisit.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; connect-src 'self' wss: https://gcaptcha4.geetest.com https://static.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com https://static.geevisit.com; frame-src 'self' https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; worker-src 'self' blob:" always; add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /console.html {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline' https://static.geetest.com https://static.geevisit.com; script-src 'self' https://static.geetest.com https://gcaptcha4.geetest.com https://static.geevisit.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; connect-src 'self' wss: https://gcaptcha4.geetest.com https://static.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com https://static.geevisit.com; frame-src 'self' https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; worker-src 'self' blob:" always; add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /admin.html {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline' https://static.geetest.com https://static.geevisit.com; script-src 'self' https://static.geetest.com https://gcaptcha4.geetest.com https://static.geevisit.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; connect-src 'self' wss: https://gcaptcha4.geetest.com https://static.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com https://static.geevisit.com; frame-src 'self' https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; worker-src 'self' blob:" always; internal; add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /sales.html {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline' https://static.geetest.com https://static.geevisit.com; script-src 'self' https://static.geetest.com https://gcaptcha4.geetest.com https://static.geevisit.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; connect-src 'self' wss: https://gcaptcha4.geetest.com https://static.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com https://static.geevisit.com; frame-src 'self' https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; worker-src 'self' blob:" always; add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /version.json { add_header Cache-Control "no-cache, no-store, must-revalidate"; }

    location ~ ^/(?:admin|backend|manage)(?:/|$) { return 404; }
    location = /_ddyidc_admin_entry_check {
        internal;
        proxy_pass http://ddyidc_backend/api/v1/security/entry;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ "^/dd-admin-[a-z0-9]{24,64}(?:/|$)" {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline' https://static.geetest.com https://static.geevisit.com; script-src 'self' https://static.geetest.com https://gcaptcha4.geetest.com https://static.geevisit.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; connect-src 'self' wss: https://gcaptcha4.geetest.com https://static.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com https://static.geevisit.com; frame-src 'self' https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; worker-src 'self' blob:" always;
        default_type text/html;
        auth_request /_ddyidc_admin_entry_check;
        auth_request_set $ddyidc_entry_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $ddyidc_entry_cookie always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
        error_page 403 = @ddyidc_admin_not_found;
        alias /var/lib/ddyidc/update/workspaces/frontend/dist/admin.html;
    }
    location @ddyidc_admin_not_found { return 404; }
    location ~ ^/sales(?:/|$) { try_files $uri $uri/ /sales.html; }
    location ~ ^/(?:console(?:/|$)|cart/?$|order/confirm/?$|bind-mobile/?$) {
        try_files $uri $uri/ /console.html;
    }
    location / { try_files $uri $uri/ /index.html; }
}
