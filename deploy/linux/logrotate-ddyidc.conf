/var/log/nginx/ddyidc-access.log /var/log/nginx/ddyidc-error.log {
    daily
    maxsize 100M
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        systemctl kill -s USR1 nginx.service >/dev/null 2>&1 || true
    endscript
}

/var/log/ddyidc/access.log /var/log/ddyidc/error.log /var/log/ddyidc/server.log {
    daily
    maxsize 100M
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0640 ddyidc ddyidc
}

/var/log/ddyidc/audit*.log /var/log/ddyidc/payment*.log /var/log/ddyidc/update*.log {
    daily
    maxsize 100M
    rotate 180
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0640 ddyidc ddyidc
}
