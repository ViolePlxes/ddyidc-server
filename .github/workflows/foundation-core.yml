name: Foundation core checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install isolated test prerequisites
        run: sudo apt-get update && sudo apt-get install -y redis-server nginx openssl mysql-server python3-yaml
      - name: Build, race and protocol regression
        run: |
          go run ./cmd/releasecheck
          python3 tools/architecture/check_automatic_migrations.py
          go test -json ./... > go-test.jsonl
          python3 tools/security/check_go_tests.py go-test.jsonl tools/security/integration-skips.json --output go-test-summary.json
          go test -race -count=3 ./pkg/auth ./pkg/clientip ./pkg/db ./internal/shared/middleware ./internal/shared/distsync
          go vet ./...
          go build ./...
          go build -trimpath -o /tmp/ddyidc-server .
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/linux -p 'test_resource_reclamation.py'
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/linux -p 'test_update_migration.py'
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 deploy/linux/tests/test_update_migration_build.py "$(id -un)" "$(command -v go)" > update-migration-build.log 2>&1
          bash deploy/linux/tests/test_resource_reclamation.sh > resource-reclamation.log 2>&1
          bash deploy/linux/tests/test_update_migration.sh > update-migration.log 2>&1
          python3 deploy/linux/tests/test_nginx_proxy.py
          python3 deploy/linux/tests/test_ledger_guard_upgrade.py
          bash deploy/linux/tests/test_order_transactions.sh > order-transactions.log 2>&1
          bash deploy/linux/tests/test_foundation_modules.sh > foundation-modules.log 2>&1
          bash deploy/linux/tests/test_schema_migrations.sh > schema-contracts.log 2>&1
          bash deploy/linux/tests/test_notification_inbox.sh > notification-inbox.log 2>&1
          bash deploy/linux/tests/test_finance_recovery.sh > finance-recovery.log 2>&1
          bash deploy/linux/tests/test_instance_edit_product.sh > instance-edit-product.log 2>&1
          bash deploy/linux/tests/test_admin_order_links.sh > admin-order-links.log 2>&1
          bash deploy/linux/tests/test_manual_product_display.sh > manual-product-display.log 2>&1
          bash deploy/linux/tests/test_provisioning_queue.sh > provisioning-queue.log 2>&1
          bash deploy/linux/tests/test_certification_queue.sh > certification-queue.log 2>&1
          bash deploy/linux/tests/test_adapter_modules.sh > adapter-modules.log 2>&1
          bash deploy/linux/tests/test_renewal_quote_gate.sh > renewal-product-controls.log 2>&1
          python3 -m unittest discover -s tools/security -p 'test_*.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/release -p 'test_*.py'
          python3 -m unittest discover -s deploy/linux -p 'test_production_preflight.py'
      - name: Source and artifact vulnerability checks
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck -json ./... > source-vulns.json
          python3 tools/security/check_govulncheck.py source-vulns.json
          govulncheck -mode=binary -json /tmp/ddyidc-server > binary-vulns.json
          python3 tools/security/check_govulncheck.py binary-vulns.json
      - name: Preserve evidence, including skipped integration tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-core-evidence
          path: |
            go-test.jsonl
            go-test-summary.json
            provisioning-queue.log
            certification-queue.log
            source-vulns.json
            binary-vulns.json
            order-transactions.log
            foundation-modules.log
            schema-contracts.log
            notification-inbox.log
            finance-recovery.log
            instance-edit-product.log
            admin-order-links.log
            manual-product-display.log
            adapter-modules.log
            renewal-product-controls.log
            resource-reclamation.log
            update-migration.log
            update-migration-build.log
